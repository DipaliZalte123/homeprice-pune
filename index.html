<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomePrice Pune - Ghar Ka Sahi Daam</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{margin:0;background:#f0fdf4}
.header{background:#059669;color:white;padding:28px 20px;text-align:center}
.header h1{margin:0;font-size:32px}
.header p{margin:8px 0 0;opacity:.9}
.card{max-width:520px;background:white;margin:-10px auto 30px auto;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
label{display:block;font-weight:600;margin:16px 0 6px;color:#111}
input,select{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#059669}
button{width:100%;margin-top:22px;background:#059669;color:white;border:none;padding:15px;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer}
button:hover{background:#047857}
#result{display:none;margin-top:20px;background:#ecfdf5;border:1px solid #a7f3d0;padding:18px;border-radius:12px;text-align:center}
#result h2{margin:0;color:#059669;font-size:28px}
#result p{margin:6px 0 0;color:#444;font-size:14px}
.footer{text-align:center;color:#888;font-size:13px;padding-bottom:20px}
</style>
</head>
<body>
<div class="header">
<h1>🏠 HomePrice Pune</h1>
<p>Pune me apne ghar ka sahi daam jaano - 1 minute me!</p>
</div>

<select id="loc">

<option value="1.35">Wakad</option>
<option value="1.15">Hinjewadi</option>
<option value="1.45">Kothrud</option>
<option value="1.0">Hadapsar</option>
<option value="1.3">Viman Nagar</option>
<option value="0.9">Pimpri</option>
<option value="1.5">Koregaon Park</option>
</select>
<label>🛏️ BHK</label>
<select id="bhk"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
<label>📐 Carpet Area (sq.ft)</label>
<input type="number" id="sqft" value="750" placeholder="e.g. 750">
